  <linearGradient id="blazer" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff7aa2"/><stop offset="1" stop-color="#ff4f7f"/></linearGradient>
</defs>
<!-- back hair -->
<path d="M106 200 C94 124 140 96 180 96 C224 96 268 124 254 200 C260 252 268 296 252 326 L108 326 C92 296 100 252 106 200 Z" fill="#3b2a24"/>
